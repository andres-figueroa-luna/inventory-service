spring.application.name=inventory-service
server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/order_db
spring.datasource.username=devuser
spring.datasource.password=devpassword
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Kafka
spring.cloud.stream.defaultBinder=kafka
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.kafka.binder.auto-create-topics=true

spring.cloud.function.definition=processOrder;restoreStock

spring.cloud.stream.bindings.restoreStock-in-0.destination=order-cancelled-topic
spring.cloud.stream.bindings.restoreStock-in-0.group=inventory-group

spring.cloud.stream.bindings.processOrder-in-0.destination=orders-topic
spring.cloud.stream.bindings.processOrder-in-0.group=inventory-group

spring.cloud.stream.bindings.stockReserved-out-0.destination=stock-reserved-topic
spring.cloud.stream.bindings.stockRejected-out-0.destination=stock-rejected-topic

spring.cloud.stream.bindings.stockRestored-out-0.destination=stock-restored-topic

# DLQ
spring.cloud.stream.kafka.bindings.processOrder-in-0.consumer.enable-dlq=true
spring.cloud.stream.bindings.processOrder-in-0.consumer.max-attempts=3
spring.cloud.stream.kafka.bindings.processOrder-in-0.consumer.dlq-name=orders-dlq